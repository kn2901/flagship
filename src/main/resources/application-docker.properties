# Used with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=docker
# after starting PostgreSQL and Redis with: docker compose up -d
spring.datasource.url=jdbc:postgresql://localhost:5432/featureflags
spring.datasource.username=featureflags
spring.datasource.password=featureflags

spring.data.redis.host=localhost
spring.data.redis.port=6379
# Fail fast: a slow Redis must not make evaluations slow. On timeout we fall back to the database.
spring.data.redis.timeout=200ms
spring.data.redis.connect-timeout=500ms
featureflags.redis.enabled=true
