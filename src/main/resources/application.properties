spring.application.name=feature-flags
server.port=8080

# ---- Database --------------------------------------------------------------
# Default: H2 stored in ./data/flags.mv.db, so it runs with nothing installed.
# Run with the "docker" profile to use PostgreSQL + Redis instead (see application-docker.properties).
spring.datasource.url=jdbc:h2:file:./data/flags
spring.datasource.username=sa
spring.datasource.password=

# Flyway creates the tables from src/main/resources/db/migration;
# Hibernate only checks that the entities match them.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---- Feature flag service --------------------------------------------------
featureflags.redis.enabled=false
featureflags.cache.local-ttl=30s
featureflags.cache.negative-ttl=5s
featureflags.cache.redis-ttl=10m
featureflags.expiry-check-interval-ms=60000

# ---- Actuator --------------------------------------------------------------
management.endpoints.web.exposure.include=health,metrics
