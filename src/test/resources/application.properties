# Tests use a throwaway in-memory database (Flyway still builds the schema).
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
featureflags.redis.enabled=false
# Effectively never: tests call the expiry job directly.
featureflags.expiry-check-interval-ms=3600000
